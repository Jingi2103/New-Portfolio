<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jino Mathew M J | Data Professional</title>

<style>
body { margin:0; font-family: 'Segoe UI', Arial, sans-serif; background:#0f172a; color:white; overflow-x: hidden; scroll-behavior: smooth;}

nav { padding:20px; }

/* HERO SECTION */
.hero {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:40px;
    padding:100px 20px;
    flex-wrap:wrap;
}

/* Profile Image Hover Effect */
.profile {
    width:160px;
    height:160px;
    object-fit: cover;
    border-radius:50%;
    border:4px solid #22c55e;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
}

.profile:hover {
    transform: scale(1.15);
    box-shadow: 0 0 25px rgba(34, 197, 94, 0.5);
}

.hero-text { max-width:550px; }

/* Typewriter Title Styling */
.typewriter-container {
    font-size: 2rem;
    font-weight: bold;
    min-height: 1.2em;
}

#changing-role {
    color: #22c55e;
}

/* The Blinking Cursor */
.cursor {
    display: inline-block;
    width: 3px;
    background-color: #22c55e;
    margin-left: 5px;
    animation: blink 0.7s infinite;
}

@keyframes blink {
    0% { opacity: 1; }
    50% { opacity: 0; }
    100% { opacity: 1; }
}

button {
    padding:12px 24px;
    background:#22c55e;
    border:none;
    color:white;
    border-radius:10px;
    cursor:pointer;
    font-weight: bold;
    transition: background 0.3s;
}

button:hover { background: #16a34a; }

.socials button { margin:5px; background:#334155; }

.card {
    background:#1e293b;
    margin:20px;
    padding:25px;
    border-radius:12px;
}

/* CHATBOT UI */
#chatbot-container {
    position:fixed;
    top:20px;
    right:20px;
    display:flex;
    align-items:center;
    gap:10px;
    z-index: 1000;
}

#chatbot-label { background:#1e293b; padding:10px; border-radius:10px; }

#chatbot-icon {
    background:#22c55e;
    padding:15px;
    border-radius:50%;
    cursor:pointer;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
    70% { box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}

#chatbot {
    position:fixed;
    top:85px;
    right:20px;
    width:320px;
    background:#1e293b;
    display:none;
    flex-direction:column;
    border-radius: 12px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
}

.chat-header { background:#22c55e; padding:12px; font-weight: bold; border-radius: 12px 12px 0 0; }

#chat-body { height:300px; padding:15px; display:flex; flex-direction:column; gap:10px; overflow-y:auto; }

.message { max-width:80%; padding:10px 14px; border-radius:15px; font-size: 14px; }
.user { align-self:flex-end; background:#22c55e; }
.bot { align-self:flex-start; background:#334155; }

#user-input { padding: 15px; border: none; outline: none; background: #0f172a; color: white; border-top: 1px solid #334155; }
</style>
</head>

<body>

<nav><h2>Jino Mathew</h2></nav>

<div id="chatbot-container">
    <div id="chatbot-label">💬 Chat with Jino's AI</div>
    <div id="chatbot-icon" onclick="toggleChat()">🤖</div>
</div>

<section class="hero">
    <img src="profile.jpg" class="profile" alt="Jino Mathew">

    <div class="hero-text">
        <div class="typewriter-container">
            I'm a <span id="changing-role"></span><span class="cursor">&nbsp;</span>
        </div>
        <p>Turning complex data into actionable insights through advanced analytics and automation.</p>

        <div class="socials">
            <a href="https://github.com/Jingi2103" target="_blank"><button>GitHub</button></a>
            <a href="https://www.linkedin.com/in/jino-mathew-2a6177221/" target="_blank"><button>LinkedIn</button></a>
        </div>
        <br>
        <a href="resume.pdf" download><button>Download Resume 📄</button></a>
    </div>
</section>

<section>
    <h2 style="padding-left: 20px;">🎓 Education</h2>
    <div class="card"><h3>MSc Data Science</h3><p>Christ University (2022–2024)</p></div>
    <div class="card"><h3>BCA</h3><p>Kristu Jayanti College (2019–2022)</p></div>
</section>

<div id="chatbot">
    <div class="chat-header">Jino's Assistant 🤖</div>
    <div id="chat-body"></div>
    <input id="user-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
</div>

<script>
// --- TYPEWRITER LOGIC ---
const roles = ["Data Analyst", "Power BI Developer", "Data Engineer"];
let roleIdx = 0;
let charIdx = 0;
let isDeleting = false;
const speed = 150; // Typing speed
const waitTime = 2000; // Time text stays typed
const roleElement = document.getElementById("changing-role");

function type() {
    const currentFullText = roles[roleIdx];
    
    if (isDeleting) {
        // Remove a character
        roleElement.innerText = currentFullText.substring(0, charIdx - 1);
        charIdx--;
    } else {
        // Add a character
        roleElement.innerText = currentFullText.substring(0, charIdx + 1);
        charIdx++;
    }

    let typeSpeed = speed;
    if (isDeleting) { typeSpeed /= 2; } // Deleting is faster

    if (!isDeleting && charIdx === currentFullText.length) {
        // Text is fully typed, wait before deleting
        isDeleting = true;
        typeSpeed = waitTime;
    } else if (isDeleting && charIdx === 0) {
        // Text is fully deleted, move to next role
        isDeleting = false;
        roleIdx = (roleIdx + 1) % roles.length;
        typeSpeed = 500;
    }

    setTimeout(type, typeSpeed);
}

// Start the animation
document.addEventListener('DOMContentLoaded', type);


// --- CHATBOT LOGIC ---
function toggleChat(){
    let c = document.getElementById("chatbot");
    c.style.display = (c.style.display === "flex") ? "none" : "flex";
}

function sendMessage(){
    let input = document.getElementById("user-input");
    let msg = input.value.trim().toLowerCase();
    if(!msg) return;

    add("You", input.value);
    input.value = "";

    setTimeout(() => {
        add("Jino", getReply(msg));
    }, 600);
}

function add(sender, text){
    let div = document.createElement("div");
    div.className = "message " + (sender === "You" ? "user" : "bot");
    div.innerHTML = text;
    let body = document.getElementById("chat-body");
    body.appendChild(div);
    body.scrollTop = body.scrollHeight;
}

function getReply(input){
    if (input.includes("hi")) return "Hi! 👋 Ask me about Jino's skills or projects!";
    if (input.includes("skills")) return "He knows Python, SQL, Power BI, and R.";
    return "I'm Jino's AI. Feel free to reach out via LinkedIn!";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jino Mathew M J | Portfolio</title>

<style>
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#0f172a,#020617);
    color:white;
}

/* GLASS CARD */
.card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border-radius:15px;
    padding:20px;
    margin:20px;
    transition:0.3s;
}
.card:hover {
    transform: translateY(-5px);
    box-shadow:0 0 20px rgba(34,197,94,0.4);
}

/* HERO */
.hero {
    display:flex;
    justify-content:center;
    align-items:center;
    gap:40px;
    padding:100px 20px;
    flex-wrap:wrap;
}

.profile {
    width:150px;
    border-radius:50%;
    border:3px solid #22c55e;
    cursor:pointer;
    transition:0.3s;
}
.profile:hover {
    transform:scale(1.05);
}

button {
    padding:10px 20px;
    background:#22c55e;
    border:none;
    border-radius:10px;
    color:white;
    cursor:pointer;
}

.socials button {
    background:#1e293b;
    margin:5px;
}

/* ROLE TEXT */
#role-text::after {
    content:"|";
    animation: blink 1s infinite;
}
@keyframes blink {
    50%{opacity:0;}
}

/* CHATBOT ICON */
#chatbot-container {
    position:fixed;
    top:20px;
    right:20px;
    display:flex;
    gap:10px;
    align-items:center;
}

#chatbot-icon {
    background:#22c55e;
    padding:15px;
    border-radius:50%;
    cursor:pointer;
    animation:pulse 1.5s infinite;
}
@keyframes pulse {
    50%{box-shadow:0 0 20px #22c55e;}
}

/* CHATBOX */
#chatbot {
    position:fixed;
    top:80px;
    right:20px;
    width:330px;
    background:#1e293b;
    display:none;
    flex-direction:column;
    border-radius:15px;
    overflow:hidden;
}

.chat-header {
    background:#22c55e;
    padding:10px;
}

#chat-body {
    height:350px;
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:10px;
    overflow-y:auto;
}

/* CHAT BUBBLES */
.message {
    padding:10px;
    border-radius:15px;
    max-width:75%;
}
.user {
    background:#22c55e;
    align-self:flex-end;
}
.bot {
    background:#334155;
}

/* SUGGESTIONS */
.suggestions button {
    font-size:12px;
    margin:3px;
}

/* IMAGE MODAL */
#imageModal {
    display:none;
    position:fixed;
    width:100%;
    height:100%;
    background:black;
}
#imageModal img {
    display:block;
    margin:auto;
    width:300px;
    margin-top:100px;
}
</style>
</head>

<body>

<!-- CHATBOT -->
<div id="chatbot-container">
<div>💬 Chat with me</div>
<div id="chatbot-icon" onclick="toggleChat()">🤖</div>
</div>

<!-- HERO -->
<section class="hero">
<img src="profile.jpg" class="profile" onclick="openImage()">

<div>
<h1 id="role-text"></h1>
<p>Data Analyst with strong background in M&E, dashboards, and analytics.</p>

<div class="socials">
<a href="https://github.com/Jingi2103"><button>GitHub</button></a>
<a href="https://linkedin.com"><button>LinkedIn</button></a>
<a href="#"><button>Medium</button></a>
</div>

<br>
<a href="resume.pdf"><button>Download Resume</button></a>
</div>
</section>

<!-- PROJECTS -->
<section>
<h2>🚀 Projects</h2>

<div class="card">
<h3>Student Analysis</h3>
<a href="#"><button>GitHub</button></a>
</div>

<div class="card">
<h3>Cricket Prediction</h3>
<a href="#"><button>GitHub</button></a>
</div>

</section>

<!-- CHATBOX -->
<div id="chatbot">
<div class="chat-header">Jino 🤖</div>

<div id="chat-body">
<div class="bot message">Hey 👋 Ask me anything about Jino!</div>

<div class="suggestions">
<button onclick="quick('education')">Education</button>
<button onclick="quick('skills')">Skills</button>
<button onclick="quick('projects')">Projects</button>
</div>
</div>

<input id="user-input" onkeydown="if(event.key==='Enter') sendMessage()">
</div>

<!-- IMAGE -->
<div id="imageModal" onclick="closeImage()">
<img src="profile.jpg">
</div>

<script>
// ROLE TYPING
const roles=["Data Analyst 📊","Power BI Developer 📈","Data Engineer ⚙️"];
let i=0,j=0,del=false;

function type(){
let text=roles[i];
document.getElementById("role-text").innerHTML=text.substring(0,j);

if(!del){ j++; if(j>text.length){del=true;setTimeout(type,1000);return;} }
else{ j--; if(j<0){del=false;i=(i+1)%roles.length;} }

setTimeout(type,del?50:100);
}
type();

// CHAT
function toggleChat(){
let c=document.getElementById("chatbot");
c.style.display=c.style.display==="flex"?"none":"flex";
}

function quick(q){
document.getElementById("user-input").value=q;
sendMessage();
}

function sendMessage(){
let input=document.getElementById("user-input");
let msg=input.value;
if(!msg) return;

add("user",msg);
input.value="";

setTimeout(()=>{
add("bot",reply(msg));
},800);
}

function add(type,text){
let div=document.createElement("div");
div.className="message "+type;
div.innerText=text;
document.getElementById("chat-body").appendChild(div);
}

function reply(msg){
msg=msg.toLowerCase();

if(msg.includes("education")) return "MSc Data Science + BCA.";
if(msg.includes("skills")) return "Python, SQL, Power BI.";
if(msg.includes("project")) return "ML + analytics projects.";

return "Ask about education, skills or projects 🙂";
}

// IMAGE
function openImage(){document.getElementById("imageModal").style.display="block";}
function closeImage(){document.getElementById("imageModal").style.display="none";}
</script>

</body>
</html>
